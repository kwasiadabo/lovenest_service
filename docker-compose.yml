services:
  api:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      # Overrides .env's DB_HOST so the app reaches the `db` service by its
      # compose network name instead of localhost.
      DB_HOST: db
      DB_PORT: 1433
      DB_TRUST_SERVER_CERT: "true"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Must match DB_PASSWORD in .env — SQL Server auths the `sa` user
      # (DB_USER) against this same password.
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mssql-data:
